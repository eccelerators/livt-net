[project]
name = "Livt.Net"
version = "1.4.2"
description = "Ethernet, IPv4, TCP, UDP, ARP, TFTP, and Telnet networking components for Livt hardware."
authors = ["Denis Vasilík"]
repository = "https://github.com/eccelerators/livt-net"
homepage = "https://github.com/eccelerators/livt-net"
keywords = ["fpga", "networking", "ethernet", "ipv4", "tcp", "udp", "tftp"]
license = "MIT"
path = "src"
outdir = "out"

[publish]
files = ["README.md", "CHANGELOG.md", "LICENSE"]

[project.organization]
name = "Eccelerators GmbH"
website = "https://eccelerators.com"

[tests]
path = "tests"
components = [
	"TcpMultiSessionMixedStorageTest",
	"TcpMultiSessionDistributedStorageTest",
	"TcpMultiSessionAutoStorageTest",
	"TcpMultiSessionArrayStorageTest",
	"TcpStreamServerMixedStorageTest",
	"TcpStreamServerDistributedStorageTest",
	"TcpStreamServerAutoStorageTest",
	"TcpStreamServerArrayStorageTest",
	"MiiFrameTest",
	"MiiFrame10Test",
	"UdpPacketTest",
	"TftpWriteServerTest",
	"TftpRequestMemoryTest",
	"TftpUploadBufferTest",
	"TcpStreamServerTest",
	"TcpMultiSessionTest",
	"TcpRetryTimerTest",
	"TelnetSessionTest",
	"CompactPacketFieldsTest",
	"EthernetFrameContractTest",
	"EthernetFrameServiceTest",
	"SharedParserTest",
	"PacketStorageParityTest",
	"PacketConvenienceTest",
	"NetworkServiceTest",
	"NetworkPolicyTest",
	"ServiceChainTest",
	"FrameLinkTest",
	"PacketParserFailureTest",
	"GenericPacketTest",
	"PacketMetadataTest",
	"PacketDataTest",
	"ArpPacketParserTest",
	"ChecksumWordSumTest",
	"ChecksumApiTest",
	"ArpResponderTest",
	"EthernetFrameBuilderTest",
	"EthernetLiteDriverTest",
	"EthernetLiteResetTest",
	"EthernetLiteReceiveWindowTest",
	"FrameCapacityTest",
	"FrameCompositionTest",
	"EthernetFrameParserTest",
	"IcmpEchoResponderTest",
	"IcmpStorageBackendTest",
	"InternetChecksumTest",
	"Ipv4HeaderBuilderTest",
	"Ipv4HeaderChecksumTest",
	"Ipv4PacketParserTest",
	"Ipv4PacketFieldsTest",
	"RamIpv4PacketParserTest",
	"TcpChecksumTest",
	"TcpConnectionRecognizerTest",
	"TcpHeaderParserTest",
	"TcpSegmentBuilderTest",
	"TcpSegmentTest",
	"TcpRamPacketTest",
	"ScheduledWordSumTest"
]

[dependencies]
Livt.IO = "1.8.2"
